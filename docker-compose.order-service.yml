version: "3.8"
services:
  postgres-order:
    image: postgres:15
    environment:
      POSTGRES_DB: orderdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata_order:/var/lib/postgresql/data

  postgres-stock:
    image: postgres:15
    environment:
      POSTGRES_DB: stockdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5433"
    volumes:
      - pgdata_stock:/var/lib/postgresql/data

  order-service:
    build:
      context: ./order-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-order:5432/orderdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      ORDER_SERVICE_PORT: 8083
    depends_on:
      - postgres-order
    ports:
      - "8083:8083"

  stock-service:
    build:
      context: ./stock-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-stock:5432/stockdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      STOCK_SERVICE_PORT: 8084
    depends_on:
      - postgres-stock
    ports:
      - "8084:8084"

  notification-service:
    build:
      context: ./notification-service
    environment:
      NOTIFICATION_SERVICE_PORT: 8085
    ports:
      - "8085:8085"

  api-gateway:
    build:
      context: ./api-gateway
    environment:
      GATEWAY_PORT: 8080
      JWT_SECRET: default_change_this_secret_to_strong_value_which_is_long
    ports:
      - "8080:8080"
    depends_on:
      - auth-service
      - order-service
      - stock-service
      - notification-service

volumes:
  pgdata_order:
  pgdata_stock:

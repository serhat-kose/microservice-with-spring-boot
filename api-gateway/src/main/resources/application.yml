server:
  port: ${GATEWAY_PORT:8080}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        # basit CORS örneği; gerektiğinde sıkılaştırın
        corsConfigurations:
          '[/**]':
            allowedOrigins: ['*']
            allowedMethods: ['GET','POST','PUT','DELETE','OPTIONS']
      routes:
        - id : product-service
          #uri: http://localhost:8045
          uri: lb://PRODUCT-SERVICE
          predicates:
            - Path=/product/**
        - id: cart-service
          #uri: http://localhost:8050
          uri: lb://CART-SERVICE
          predicates:
            - Path=/cart/**

eureka:
  instance:
    appname: ${spring.application.name}
  client:
    service-url:
      defaultZone: http://localhost:9000/eureka

management:
  endpoints:
    web:
      exposure:
        include: health,info

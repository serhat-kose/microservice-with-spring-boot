server:
  port: ${GATEWAY_PORT:8080}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        # basit CORS örneği; gerektiğinde sıkılaştırın
        corsConfigurations:
          '[/**]':
            allowedOrigins: ['*']
            allowedMethods: ['GET','POST','PUT','DELETE','OPTIONS']

eureka:
  instance:
    appname: ${spring.application.name}
  client:
    service-url:
      defaultZone: http://localhost:9000/eureka

management:
  endpoints:
    web:
      exposure:
        include: health,info

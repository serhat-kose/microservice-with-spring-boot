server:
  port: ${PAYMENT_SERVICE_PORT:8086}
  tomcat:
    threads:
      max: ${TOMCAT_MAX_THREADS:200}
      min-spare: ${TOMCAT_MIN_THREADS:20}
    accept-count: 100
    max-connections: 10000

spring:
  application:
    name: payment-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/paymentdb}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: 3000
      idle-timeout: 60000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 5
      properties:
        enable.idempotence: true
        linger.ms: 10
        compression.type: snappy
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      group-id: payment-group
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      concurrency: ${KAFKA_LISTENER_CONCURRENCY:3}
      ack-mode: record

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER:http://eureka-server:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true

ecommerce:
  payment:
    # Share of authorisations the simulated gateway declines (0.0-1.0). Zero keeps ordinary
    # runs deterministic; raise it to exercise the saga's rollback path, which was
    # unreachable while payment always returned SUCCESS.
    decline-rate: ${PAYMENT_DECLINE_RATE:0.0}
    max-amount: ${PAYMENT_MAX_AMOUNT:100000.00}
